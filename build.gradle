buildscript {
	repositories {
		mavenCentral()
		maven { url = "https://maven.minecraftforge.net" }
		maven { url = "https://repo.spongepowered.org/repository/maven-public" }
	}
	dependencies {
		classpath "net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT"
		classpath "org.spongepowered:mixingradle:0.6-SNAPSHOT"
	}
}

apply plugin: "net.minecraftforge.gradle.liteloader"
apply plugin: "org.spongepowered.mixin"

version = '1.1.1'
def mcVersion = '1.12.2'
def modName = 'UsefulMod'
def modId = modName.toLowerCase()
group = "nessiesson.$modId"

minecraft {
	version = mcVersion.toString()
	mappings = 'stable_39'
	runDir = 'run'
	makeObfSourceJar = false

	replace "@VERSION@", project.version.toString()
	replace "@NAME@", modName.toString()
}

mixin {
	defaultObfuscationEnv notch
	add sourceSets.main, "mixins.${modId}.refmap.json"
}

litemod.json {
	author = "nessie".toString()
	name = modName
	displayName = modName
	mcversion = mcVersion
	description = "A very UsefulMod."
	mixinConfigs += "mixins.${modId}.json".toString()
	mixinConfigs += "mixins.clientcommands.json".toString()
}

jar {
	classifier = ''
	baseName = "$modName-$mcVersion"
	from litemod.outputs
}

compileJava {
	sourceCompatibility = '1.8'
	targetCompatibility = '1.8'
}

runClient {
	jvmArgs "-Dmixin.debug=true"
}
